<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#0d111d"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .orb-3 {
        animation: floatOrb3 12s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: pulseRing 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .pulse-pill {
        animation: pillHover 4s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 30s linear infinite;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
        100% { transform: translate(-40px, -20px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-70px, -40px) scale(1.2); }
        100% { transform: translate(50px, 30px) scale(0.9); }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px) scale(0.9); }
        50% { transform: translate(40px, -50px) scale(1.1); }
        100% { transform: translate(-30px, 40px) scale(1.05); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pillHover {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.22"/>
    <circle class="orb-2" cx="1020" cy="180" r="160" fill="#818cf8" opacity="0.25"/>
    <circle class="orb-3" cx="600" cy="360" r="130" fill="#c084fc" opacity="0.2"/>
  </g>

  <!-- Subtle Tech Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Network Connecting Lines (Background Accent) -->
  <g class="wave-line" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 120 320 C 300 240, 420 380, 600 310 C 780 240, 920 350, 1080 290" />
    <path d="M 80 160 C 260 220, 390 130, 580 180 C 760 230, 960 120, 1120 180" />
  </g>

  <!-- Background Network Floating Nodes -->
  <g class="pulse-node" opacity="0.6">
    <circle cx="120" cy="320" r="4" fill="#38bdf8"/>
    <circle cx="600" cy="310" r="5" fill="#818cf8"/>
    <circle cx="1080" cy="290" r="4" fill="#c084fc"/>
    <circle cx="260" cy="220" r="3.5" fill="#38bdf8"/>
    <circle cx="960" cy="120" r="4.5" fill="#818cf8"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed completely visible & unobstructed -->
  <g id="foreground-content">
    <!-- Top Category Badge -->
    <g transform="translate(420, 48)">
      <rect width="360" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="180" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">
        CURATED AWESOME ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">
      Customer Community Platforms
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      The definitive directory of SaaS solutions, open-source engines, forums, and developer hubs
    </text>

    <!-- Interactive / Feature Pills in Foreground -->
    <g transform="translate(600, 270)">
      <!-- Pill 1: Forum Engines -->
      <g transform="translate(-370, 0)" class="pulse-pill">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
        <text x="115" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">💬 Modern Forums</text>
        <text x="115" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Discourse • Flarum • NodeBB</text>
      </g>

      <!-- Pill 2: Real-time Comms -->
      <g transform="translate(-115, 0)" class="pulse-pill">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad2)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
        <text x="115" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8">⚡ Real-Time Chat &amp; Hubs</text>
        <text x="115" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Rocket.Chat • Mattermost • Zulip</text>
      </g>

      <!-- Pill 3: Enterprise & Social -->
      <g transform="translate(140, 0)" class="pulse-pill">
        <rect width="230" height="52" rx="12" fill="url(#pillGrad3)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/>
        <text x="115" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc">🏢 Enterprise &amp; Creator</text>
        <text x="115" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Khoros • Circle • HumHub</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" letter-spacing="1.5">
      ★ STAR REPOSITORIES • PRICING MATRICES • SELF-HOSTED OPEN SOURCE
    </text>
  </g>
</svg>
